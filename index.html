
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L1benj Cherif</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080b18;
      color: white;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
      background:
        radial-gradient(circle at top left, #312064, transparent 45%),
        radial-gradient(circle at bottom right, #073b58, transparent 45%),
        #080b18;
    }

    .welcome {
      width: 100%;
      max-width: 650px;
      padding: 45px 25px;
      border: 1px solid #38325f;
      border-radius: 22px;
      background: rgba(18, 22, 45, 0.85);
      box-shadow: 0 0 30px rgba(112, 72, 255, 0.15);
      animation: appear 1s ease-out;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .welcome:hover {
      transform: translateY(-7px);
      box-shadow: 0 0 40px rgba(112, 72, 255, 0.4);
    }

    h1 {
      margin: 0 0 25px;
      font-size: clamp(42px, 8vw, 65px);
      font-weight: 900;
      background: linear-gradient(90deg, #a78bfa, #38bdf8, #f0abfc);
      background-size: 200% auto;
      color: #a78bfa;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: colors 5s linear infinite;
    }

    h2 {
      font-size: 28px;
      color: #67e8f9;
      margin-bottom: 20px;
    }

    p {
      font-size: 17px;
      color: #cbd5e1;
      line-height: 1.8;
    }

    .tag {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      border-radius: 30px;
      background: linear-gradient(90deg, #7c3aed, #0284c7);
      font-weight: bold;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .tag:hover {
      transform: scale(1.06);
      box-shadow: 0 0 25px #7c3aed;
    }

    footer {
      text-align: center;
      padding: 22px;
      color: #94a3b8;
      border-top: 1px solid #252447;
      font-size: 14px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes colors {
      to {
        background-position: 200% center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main>
    <section class="welcome">
      <h1><strong>Salam 👋</strong></h1>

      <h2>I'm L1benj Cherif</h2>

      <p>Marhba bik f site dyali!</p>

      <p>
        Ana kan3llam Web Development 💻<br>
        Kan-t3llam HTML w CSS, w kanbni lmosta9bal dyali f programmation.
      </p>

      <div class="tag">Future Web Developer 🚀</div>
    </section>
  </main>

  <footer>
    © 2026 L1benj Cherif
  </footer>

</body>
</html>
