
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>L1benj Cherif - Mon site</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dff1ff, #8fc7ff);
      color: #18345a;
    }

    .card {
      width: 100%;
      max-width: 650px;
      padding: 40px 25px;
      text-align: center;
      background: white;
      border-radius: 25px;
      box-shadow: 0 12px 35px rgba(30, 100, 180, 0.18);
    }

    .avatar {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #2580e8;
      border-radius: 50%;
      background: #d7eaff;
      font-size: 48px;
    }

    h1 {
      margin: 10px 0;
      color: #0878ed;
      font-size: 36px;
    }

    h2 {
      margin: 12px 0 20px;
      font-size: 25px;
    }

    p {
      font-size: 17px;
      line-height: 1.7;
    }

    .badges {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 25px 0;
    }

    .badge {
      padding: 10px 17px;
      border-radius: 20px;
      background: #e4f1ff;
      color: #145da0;
      font-weight: bold;
    }

    button {
      padding: 14px 25px;
      border: none;
      border-radius: 12px;
      background: #0878ed;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #075fc0;
    }

    .motto {
      margin-top: 25px;
      color: #0878ed;
      font-style: italic;
    }

    footer {
      margin-top: 30px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="avatar">💻</div>

    <h1>Salam! 👋</h1>
    <h2>L1benj Cherif</h2>

    <p>
      Marhba bik f site dyali!<br>
      Ana kan3allem développement web.
    </p>

    <div class="badges">
      <span class="badge">HTML</span>
      <span class="badge">CSS</span>
      <span class="badge">JavaScript</span>
    </div>

    <button onclick="alert('Marhba bik f site dyali! 💙')">
      Klik 3liya!
    </button>

    <p class="motto">
      Petit pas aujourd'hui, grand projet demain!
    </p>

    <footer>
      © 2026 L1benj Cherif
    </footer>

  </main>
</body>
</html>
