
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L1benj Cherif</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080b18;
      color: white;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      text-align: center;
      background:
        radial-gradient(circle at top left, #312064, transparent 45%),
        radial-gradient(circle at bottom right, #073b58, transparent 45%),
        #080b18;
    }

    .welcome {
      padding: 45px 25px;
      border: 1px solid #38325f;
      border-radius: 20px;
      background: #12162ddd;
      box-shadow: 0 0 30px #7048ff33;
      max-width: 100%;
    }

    h1 {
      margin: 0 0 30px;
      font-size: clamp(42px, 9vw, 70px);
      font-weight: 900;
      background: linear-gradient(90deg, #a78bfa, #38bdf8, #f0abfc);
      background-size: 200% auto;
      color: #a78bfa;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: colors 5s linear infinite;
    }

    button {
      padding: 14px 35px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(90deg, #7c3aed, #0284c7);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px #7c3aed;
    }

    #message {
      display: none;
      margin-top: 30px;
      font-size: clamp(25px, 6vw, 40px);
      font-weight: bold;
      color: #67e8f9;
    }

    #message.show {
      display: block;
      animation: appear 0.8s ease-out;
    }

    footer {
      padding: 18px;
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes colors {
      to {
        background-position: 200% center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main>
    <section class="welcome">
      <h1>Salam</h1>

      <button onclick="showMessage()">Click Me</button>

      <div id="message" aria-live="polite">
        Salam L1benj Cherif ❤️
      </div>
    </section>
  </main>

  <footer>
    © 2026 L1benj Cherif
  </footer>

  <script>
    function showMessage() {
      const message = document.getElementById("message");
      message.classList.add("show");
    }
  </script>

</body>
</html>
