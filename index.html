

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b18">
  <meta name="description" content="Welcome to L1benj Cherif's personal website.">
  <title>L1benj Cherif | Welcome</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080b18;
      --purple: #a78bfa;
      --blue: #38bdf8;
      --white: #f8fafc;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);
      background: var(--bg);
    }

    /* Moving background glow */
    .glow {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
      animation: float 9s ease-in-out infinite alternate;
    }

    .glow-one {
      top: -100px;
      left: -100px;
      background: #7c3aed;
    }

    .glow-two {
      right: -100px;
      bottom: -100px;
      background: #0284c7;
      animation-delay: -4s;
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 35px 20px;
    }

    .welcome {
      width: 100%;
      max-width: 650px;
      animation: entrance 1s ease both;
    }

    .tagline {
      display: inline-block;
      margin-bottom: 22px;
      color: #c4b5fd;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      animation: fade-in 1.2s ease both;
    }

    h1 {
      font-size: clamp(58px, 13vw, 105px);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -4px;
      background: linear-gradient(
        100deg,
        #a78bfa,
        #38bdf8,
        #f0abfc,
        #a78bfa
      );
      background-size: 300% auto;
      color: var(--purple);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient-flow 6s linear infinite;
      filter: drop-shadow(0 0 22px #8b5cf633);
    }

    .subtitle {
      max-width: 430px;
      margin: 22px auto 30px;
      color: #a5b4cc;
      font-size: clamp(14px, 3vw, 17px);
      line-height: 1.8;
    }

    .button-wrap {
      display: flex;
      justify-content: center;
    }

    .magic-button {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border: 1px solid #a78bfa66;
      border-radius: 50px;
      padding: 15px 38px;
      background: linear-gradient(110deg, #7c3aed, #2563eb);
      color: white;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 0 25px #7c3aed30;
      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .magic-button::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: 0;
      left: -120%;
      width: 70%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        #ffffff55,
        transparent
      );
      transform: skewX(-20deg);
      transition: left 0.6s ease;
    }

    .magic-button:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 0 35px #7c3aed88;
    }

    .magic-button:hover::before {
      left: 150%;
    }

    .magic-button:active {
      transform: scale(0.97);
    }

    .magic-button:focus-visible {
      outline: 2px solid #67e8f9;
      outline-offset: 5px;
    }

    #message {
      min-height: 50px;
      margin-top: 30px;
      color: #67e8f9;
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    #message.show {
      animation: message-pop 0.7s cubic-bezier(.2, .8, .2, 1) both;
    }

    .heart {
      display: inline-block;
      color: #fb7185;
      animation: heartbeat 1s ease-in-out infinite;
    }

    footer {
      position: relative;
      z-index: 1;
      padding: 22px 15px;
      text-align: center;
      color: #8490a8;
      font-size: 13px;
    }

    footer span {
      color: #c4b5fd;
    }

    @keyframes gradient-flow {
      to {
        background-position: 300% center;
      }
    }

    @keyframes float {
      from {
        transform: translate(0, 0) scale(1);
      }
      to {
        transform: translate(45px, 35px) scale(1.15);
      }
    }

    @keyframes entrance {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes message-pop {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.92);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    @media (max-width: 480px) {
      .glow {
        width: 230px;
        height: 230px;
        filter: blur(75px);
      }

      h1 {
        letter-spacing: -2px;
      }

      .subtitle {
        margin-top: 18px;
      }

      .magic-button {
        padding: 14px 32px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="glow glow-one" aria-hidden="true"></div>
  <div class="glow glow-two" aria-hidden="true"></div>

  <main>
    <section class="welcome">
      <p class="tagline">Welcome to my world</p>

      <h1>Salam</h1>

      <p class="subtitle">
        A little website, a little magic.
        Welcome to L1benj Cherif's world.
      </p>

      <div class="button-wrap">
        <button
          class="magic-button"
          id="welcomeButton"
          type="button"
          aria-controls="message"
          aria-expanded="false"
        >
          Click Me ✨
        </button>
      </div>

      <div id="message" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    © 2026 <span>L1benj Cherif</span>. All rights reserved.
  </footer>

  <script>
    const button = document.getElementById("welcomeButton");
    const message = document.getElementById("message");

    button.addEventListener("click", function () {
      message.classList.remove("show");

      // Restart the animation when the button is clicked again.
      void message.offsetWidth;

      message.innerHTML =
        'Salam L1benj Cherif <span class="heart">♥</span>';

      message.classList.add("show");
      button.setAttribute("aria-expanded", "true");
      button.textContent = "Welcome! ✨";
    });
  </script>
</body>
</html>
