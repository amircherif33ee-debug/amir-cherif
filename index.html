

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L1benj Cherif</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: #080b18;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 15px;
      text-align: center;
      background:
        radial-gradient(circle at top left, #312064, transparent 45%),
        radial-gradient(circle at bottom right, #073b58, transparent 45%),
        #080b18;
    }

    .welcome {
      max-width: 650px;
      width: 100%;
      padding: 40px 20px;
      border: 1px solid #38325f;
      border-radius: 20px;
      background: #12162ddd;
      box-shadow: 0 0 30px #7048ff33;
      animation: appear 1s ease-out;
      transition: 0.3s;
    }

    .welcome:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 40px #7048ff66;
    }

    h1 {
      font-size: clamp(45px, 9vw, 65px);
      font-weight: 900;
      margin: 0 0 25px;
      background: linear-gradient(90deg, #a78bfa, #38bdf8, #f0abfc);
      background-size: 200% auto;
      color: #a78bfa;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: colors 5s linear infinite;
    }

    h2 {
      color: #67e8f9;
      font-size: 27px;
    }

    p {
      color: #cbd5e1;
      font-size: 17px;
      line-height: 1.8;
    }

    .tag {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 22px;
      border-radius: 30px;
      background: linear-gradient(90deg, #7c3aed, #0284c7);
      font-weight: bold;
    }

    footer {
      padding: 20px;
      text-align: center;
      color: #94a3b8;
      border-top: 1px solid #252447;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes colors {
      to {
        background-position: 200% center;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="welcome">
      <h1>Salam 👋</h1>
      <h2> L1benj Cherif</h2>

      <p>Marhba bik f site dyali!</p>
       
         
      </p>

      <div class="tag">Future Web Developer 🚀</div>
    </section>
  </main>

  <footer>
    © 2026 L1benj Cherif
  </footer>
</body>
</html>
