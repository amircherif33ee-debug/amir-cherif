
<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L1benj Cherif | Développeur</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #dff1ff, #a9d5ff);
  color: #17345d;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px 15px;
}

.card {
  background: white;
  max-width: 650px;
  width: 100%;
  text-align: center;
  padding: 40px 25px;
  border-radius: 25px;
  box-shadow: 0 15px 40px #438bce40;
}

.avatar {
  width: 115px;
  height: 115px;
  border-radius: 50%;
  background: #d7eaff;
  border: 4px solid #2580e8;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
}

h1 {
  color: #0878ed;
  font-size: 40px;
  margin: 10px 0;
}

h2 {
  margin: 10px 0 20px;
}

p {
  font-size: 18px;
  line-height: 1.7;
}

.badges {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 25px 0;
}

.badge {
  background: #e4f1ff;
  padding: 12px 20px;
  border-radius: 25px;
  font-weight: bold;
}

button {
  background: #0878ed;
  color: white;
  border: none;
  padding: 15px 28px;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #075fc0;
}

.motto {
  color: #0878ed;
  font-style: italic;
  margin-top: 25px;
}

footer {
  margin-top: 30px;
  font-size: 14px;
  color: #526d91;
}

</style>
</head>

<body>
  <main class="card">

    <div class="avatar">💻</div>

    <h1>Salam ! 👋</h1>
    <h2>L1benj Cherif</h2>

    <p>
      Ana kan3allem développement informatique.<br>
      Bienvenue f site dyali !
    </p>

    <div class="badges">
      <span class="badge">🟠 HTML</span>
      <span class="badge">🔵 CSS</span>
      <span class="badge">🟡 JavaScript</span>
    </div>

    <button onclick="alert('Marhba bik f site dyali! 💙')">
      Klik 3liya →
    </button>

    <p class="motto">
      Petit pas aujourd'hui, grand projet demain !
    </p>

    <footer>
      © 2026 L1benj Cherif — Futur Developer 💙
    </footer>

</body>
