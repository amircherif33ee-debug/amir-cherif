
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b18">
  <title>L1BENJ CHERIF</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
      background: #080b18;
    }

    .glow {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.4;
      pointer-events: none;
      animation: float 8s ease-in-out infinite alternate;
    }

    .glow-one {
      top: -100px;
      left: -100px;
      background: #7c3aed;
    }

    .glow-two {
      right: -100px;
      bottom: -100px;
      background: #0284c7;
      animation-delay: -4s;
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
    }

    .welcome {
      width: 100%;
      max-width: 650px;
      animation: entrance 1s ease both;
    }

    .tagline {
      margin-bottom: 22px;
      color: #c4b5fd;
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(55px, 13vw, 100px);
      font-weight: 900;
      letter-spacing: -3px;
      background: linear-gradient(
        90deg,
        #a78bfa,
        #38bdf8,
        #f0abfc,
        #a78bfa
      );
      background-size: 300% auto;
      color: #a78bfa;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient-flow 5s linear infinite;
      filter: drop-shadow(0 0 20px #8b5cf644);
    }

    .subtitle {
      margin: 22px auto 30px;
      color: #a5b4cc;
      font-size: clamp(14px, 3vw, 17px);
      line-height: 1.8;
    }

    button {
      position: relative;
      overflow: hidden;
      border: 1px solid #a78bfa66;
      border-radius: 50px;
      padding: 15px 38px;
      background: linear-gradient(110deg, #7c3aed, #2563eb);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 25px #7c3aed44;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    button:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 0 35px #7c3aedaa;
    }

    button:active {
      transform: scale(0.97);
    }

    #message {
      min-height: 45px;
      margin-top: 30px;
      color: #67e8f9;
      font-size: clamp(24px, 6vw, 38px);
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    #message.show {
      animation: pop 0.7s ease both;
    }

    .heart {
      display: inline-block;
      color: #fb7185;
      animation: heartbeat 1s ease-in-out infinite;
    }

    footer {
      position: relative;
      z-index: 1;
      padding: 20px 12px;
      text-align: center;
      color: #8490a8;
      font-size: 13px;
    }

    footer span {
      color: #c4b5fd;
    }

    @keyframes gradient-flow {
      to {
        background-position: 300% center;
      }
    }

    @keyframes float {
      from {
        transform: translate(0, 0);
      }
      to {
        transform: translate(45px, 35px);
      }
    }

    @keyframes entrance {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    @media (max-width: 480px) {
      .glow {
        width: 220px;
        height: 220px;
        filter: blur(75px);
      }

      h1 {
        letter-spacing: -2px;
      }

      button {
        padding: 14px 32px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="glow glow-one" aria-hidden="true"></div>
  <div class="glow glow-two" aria-hidden="true"></div>

  <main>
    <section class="welcome">
      <p class="tagline">WELCOME TO MY WORLD</p>

      <h1>Salam</h1>

      <p class="subtitle">
        Welcome to the world of L1BENJ CHERIF ✨
      </p>

      <button id="welcomeButton" type="button">
        Click Me ✨
      </button>

      <div id="message" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    © 2026 <span>L1BENJ CHERIF</span>. All rights reserved.
  </footer>

  <script>
    const button = document.getElementById("welcomeButton");
    const message = document.getElementById("message");

    button.addEventListener("click", function () {
      message.classList.remove("show");
      void message.offsetWidth;

      message.innerHTML =
        'Salam Oumaima <span class="heart">♥</span>';

      message.classList.add("show");
      button.textContent = "Welcome! ✨";
    });
  </script>
</body>
</html>
