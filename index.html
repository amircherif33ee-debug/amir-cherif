
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080008">
  <title>L1BENJ CHERIF ☠️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(ellipse at top left, #3b0764, transparent 48%),
        radial-gradient(ellipse at bottom right, #082f49, transparent 48%),
        #080008;
    }

    .glow {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.4;
      pointer-events: none;
      animation: float 7s ease-in-out infinite alternate;
    }

    .glow-one {
      top: -100px;
      left: -100px;
      background: #a21caf;
    }

    .glow-two {
      right: -100px;
      bottom: -100px;
      background: #0891b2;
      animation-delay: -3s;
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .welcome {
      width: 100%;
      max-width: 700px;
      animation: entrance 1s ease both;
    }

    .tagline {
      margin-bottom: 25px;
      color: #f0abfc;
      font-size: 12px;
      letter-spacing: 5px;
    }

    h1 {
      font-size: clamp(42px, 10vw, 82px);
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: 1px;
      background: linear-gradient(
        90deg,
        #fb7185,
        #c084fc,
        #38bdf8,
        #fb7185
      );
      background-size: 300% auto;
      color: #c084fc;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 18px #e879f944);
      animation: gradient-flow 5s linear infinite,
                 danger-pulse 2s ease-in-out infinite;
    }

    .subtitle {
      margin: 24px auto 30px;
      color: #cbd5e1;
      font-size: clamp(14px, 3vw, 17px);
      line-height: 1.8;
    }

    button {
      border: 1px solid #e879f988;
      border-radius: 50px;
      padding: 15px 38px;
      background: linear-gradient(110deg, #86198f, #1d4ed8);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 25px #a21caf55;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    button:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 0 35px #d946efaa;
    }

    button:active {
      transform: scale(0.97);
    }

    button:focus-visible {
      outline: 2px solid #67e8f9;
      outline-offset: 5px;
    }

    #message {
      min-height: 48px;
      margin-top: 30px;
      color: #67e8f9;
      font-size: clamp(28px, 7vw, 48px);
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    #message.show {
      animation: pop 0.7s ease both;
    }

    footer {
      position: relative;
      z-index: 1;
      padding: 20px 12px;
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
    }

    footer span {
      color: #e9d5ff;
    }

    @keyframes gradient-flow {
      to {
        background-position: 300% center;
      }
    }

    @keyframes float {
      from { transform: translate(0, 0); }
      to { transform: translate(45px, 35px); }
    }

    @keyframes entrance {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes danger-pulse {
      0%, 100% {
        filter: drop-shadow(0 0 12px #e879f944);
      }
      50% {
        filter: drop-shadow(0 0 28px #fb7185aa);
      }
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.85);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 480px) {
      .glow {
        width: 210px;
        height: 210px;
        filter: blur(75px);
      }

      button {
        padding: 14px 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="glow glow-one" aria-hidden="true"></div>
  <div class="glow glow-two" aria-hidden="true"></div>

  <main>
    <section class="welcome">
      <p class="tagline">⚠️ WELCOME TO MY WORLD ⚠️</p>

      <h1>9wdtiha ☠️</h1>

      <p class="subtitle">
        L1BENJ CHERIF — NO LIMITS 🔥
      </p>

      <button id="welcomeButton" type="button">
        Click Me ☠️
      </button>

      <div id="message" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    © 2026 <span>L1BENJ CHERIF</span> ☠️
  </footer>

  <script>
    const button = document.getElementById("welcomeButton");
    const message = document.getElementById("message");

    button.addEventListener("click", function () {
      message.classList.remove("show");
      void message.offsetWidth;

      message.textContent = "9wdtiha ☠️";
      message.classList.add("show");

      button.textContent = "DANGER MODE ☠️";
    });
  </script>
</body>
</html>
